name: ICS-Guard CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Run backend tests
        env:
          NODE_ENV: test
          PORT: 8000
          JWT_ACCESS_SECRET: dummy_very_long_access_secret_key_length_32
          JWT_REFRESH_SECRET: dummy_very_long_refresh_secret_key_length_32
          AES_SECRET_KEY: dummy_very_long_aes_secret_key_length_32
          AES_IV: dummy_aes_iv_length_16
          DEVICE_API_KEY: dummy_device_api_key
          SIMULATOR_API_KEY: dummy_simulator_api_key
          ATTACK_SIMULATOR_API_KEY: dummy_attack_simulator_key
          GEMINI_API_KEY: dummy_gemini_api_key
        run: |
          cd backend
          npm test

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

  web-simulator-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'iot/web-simulator/package-lock.json'

      - name: Install web-simulator dependencies
        run: |
          cd iot/web-simulator
          npm ci

      - name: Build web-simulator
        run: |
          cd iot/web-simulator
          npm run build

  ai-engine-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'ai-engine/requirements.txt'

      - name: Install AI Engine dependencies
        run: |
          cd ai-engine
          pip install -r requirements.txt

      - name: Verify FastAPI imports
        run: |
          cd ai-engine
          python -c "import main; print('AI Engine FastAPI imported successfully!')"
