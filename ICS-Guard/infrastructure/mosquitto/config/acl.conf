# Mosquitto Topic Access Control List (ACL)
# ICS-Guard v15 - Three-Domain Security Policy

# User 1: ics-backend (ICS SOC Main Backend)
user ics-backend
topic read ics/v1/telemetry/#
topic read ics/v1/hardware/snapshot/#
topic read ics/v1/acks/#
topic read ics/v1/runtime/heartbeat/#
topic write ics/v1/commands/security/#
topic write ics/v1/commands/policy/#

# User 2: hardware-runtime-01 (Hardware Simulator Runtime Engine)
user hardware-runtime-01
topic write ics/v1/telemetry/#
topic write ics/v1/hardware/snapshot/#
topic write ics/v1/acks/#
topic write lab/v1/acks/#
topic write ics/v1/runtime/heartbeat/#
topic read ics/v1/commands/security/#
topic read ics/v1/commands/policy/#
topic read lab/v1/commands/attack/#

# User 3: attack-adapter (Hardware Attack Adapter Interface)
user attack-adapter
topic write lab/v1/commands/attack/#
topic read lab/v1/acks/#
