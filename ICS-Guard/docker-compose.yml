version: '3.8'

services:
  # 1. Frontend Dashboard (React/Vite)
  frontend:
    build:
      context: ./frontend
    ports:
      # Map chính xác cổng FRONTEND_PORT (ví dụ: 3000 -> 3000)
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    volumes:
      # Mount code để hot-reload
      - ./frontend:/app
      # Giữ lại node_modules trong container
      - /app/node_modules
    environment:
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
      - VITE_GOOGLE_GSI_CLIENT_URL=${VITE_GOOGLE_GSI_CLIENT_URL}
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      - backend
    restart: always

  # 2. Backend API (Node.js/Express)
  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./shared:/shared
    environment:
      - PORT=8000
      - NODE_ENV=${NODE_ENV}
      - MONGO_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin&tls=true&tlsCAFile=/app/src/certs/ca.crt&tlsAllowInvalidHostnames=true
      - MONGO_DB=${MONGO_DB}
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      - INFLUXDB_URL=http://influxdb:8086
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_EXPIRY=${JWT_ACCESS_EXPIRY}
      - JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY}
      - DEVICE_API_KEY=${DEVICE_API_KEY}
      - SIMULATOR_API_KEY=${SIMULATOR_API_KEY}
      - ATTACK_SIMULATOR_API_KEY=${ATTACK_SIMULATOR_API_KEY}
      - AES_SECRET_KEY=${AES_SECRET_KEY}
      - AES_IV=${AES_IV}
      - FRONTEND_URL=${FRONTEND_URL}
      - REDIS_URL=rediss://:${REDIS_PASSWORD}@redis:6379
      - AI_ENGINE_URL=https://ai-engine:5000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ALLOW_INSECURE_TLS=${ALLOW_INSECURE_TLS}
      - NODE_EXTRA_CA_CERTS=/app/src/certs/ca.crt
      - REQUIRE_TLS=true
    depends_on:
      - mongodb
      - rabbitmq
      - influxdb
      - redis
    restart: always

  # 3. MongoDB (Event DB - Lưu sự kiện, rule, incident)
  mongodb:
    image: mongo:6-jammy
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    command: ["mongod", "--tlsMode", "preferTLS", "--tlsCertificateKeyFile", "/certs/mongodb.pem", "--tlsCAFile", "/certs/ca.crt"]
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      - ./infrastructure/mongodb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - ./infrastructure/mongodb/certs:/certs:ro
    restart: always

  # 4. InfluxDB (Time-series DB - Lưu telemetry từ thiết bị)
  influxdb:
    image: influxdb:1.8-alpine
    environment:
      - INFLUXDB_ADMIN_USER=${INFLUXDB_ADMIN_USER}
      - INFLUXDB_ADMIN_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - INFLUXDB_DB=${INFLUXDB_DB}
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb
    restart: always

  # 5. Mosquitto (MQTT Protocol cho IoT)
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_TLS_PORT:-8883}:8883"
    volumes:
      - ./infrastructure/mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: always

  # 6. RabbitMQ (Message Queue)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: always

  # 6.5. Redis (Distributed Cache & Rate Limiting)
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --port 0
      --tls-port 6379
      --tls-cert-file /certs/redis.crt
      --tls-key-file /certs/redis.key
      --tls-ca-cert-file /certs/ca.crt
      --tls-auth-clients no
      --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./infrastructure/redis/certs:/certs:ro
    restart: always

  # 7. Nginx (Firewall/Proxy)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: always

  # 8. AI Engine (Python/FastAPI)
  ai-engine:
    build:
      context: ./ai-engine
    ports:
      - "${AI_ENGINE_PORT:-5000}:5000"
    volumes:
      - ./ai-engine:/app
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
    command: uvicorn main:app --host 0.0.0.0 --port 5000 --reload --ssl-keyfile /app/app/certs/ai-engine.key --ssl-certfile /app/app/certs/ai-engine.crt
    restart: always

  # 8.5. Ollama (AI Local Model)
  ollama:
    image: ollama/ollama:latest
    container_name: ics_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 10 && ollama pull $${OLLAMA_MODEL:-qwen2.5:3b} && wait"]

  # 9. IoT Device Simulator (Python Asyncio)
  simulator:
    build:
      context: ./iot
      dockerfile: simulator/Dockerfile
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=8883
      - BACKEND_URL=http://backend:8000
      - DEVICE_API_KEY=${DEVICE_API_KEY}
      - SIMULATOR_API_KEY=${SIMULATOR_API_KEY}
      - AES_SECRET_KEY=${AES_SECRET_KEY}
      - AES_IV=${AES_IV}
      - ALLOW_INSECURE_TLS=${ALLOW_INSECURE_TLS}
    depends_on:
      - mosquitto
      - backend
    restart: always


volumes:
  mongodb_data:
  influxdb_data:
  mosquitto_data:
  mosquitto_log:
  rabbitmq_data:
  ollama_data:
  redis_data:
