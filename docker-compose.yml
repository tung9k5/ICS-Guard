services:
  # 1. Frontend Admin (ReactJS)
  frontend-adm:
    build:
      context: ./frontend-adm
    ports:
      - "3000:3000"
    volumes:
      - ./frontend-adm:/app
      - /app/node_modules
    environment:
      - FRONTEND_ADM_PORT=3000
      - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - VITE_GOOGLE_GSI_CLIENT_URL=${VITE_GOOGLE_GSI_CLIENT_URL:-https://accounts.google.com/gsi/client}
      - VITE_API_URL=${VITE_API_URL}
      - USE_OPENAI=${USE_OPENAI}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - VITE_PROXY_TARGET=${VITE_PROXY_TARGET}
    depends_on:
      - backend
    restart: always

  # 2. Frontend Customer (ReactJS)
  frontend-ctm:
    build:
      context: ./frontend-ctm
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-ctm:/app
      - /app/node_modules
    environment:
      - FRONTEND_CTM_PORT=5173
      - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - VITE_GOOGLE_GSI_CLIENT_URL=${VITE_GOOGLE_GSI_CLIENT_URL:-https://accounts.google.com/gsi/client}
      - VITE_API_URL=${VITE_API_URL}
      - USE_OPENAI=${USE_OPENAI}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - VITE_PROXY_TARGET=${VITE_PROXY_TARGET}
    depends_on:
      - backend
    restart: always

  # 3. Backend API (Node.js / Express)
  backend:
    build:
      context: ./backend
      args:
        - AI_SERVICES_PATH=../ai-services
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./ai-services:/ai-services
      - /ai-services/node_modules
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - PORT=${BACKEND_PORT}
      - USE_OPENAI=${USE_OPENAI}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MONGO_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-123456}@mongodb:27017/${MONGO_DB}?authSource=admin
      - MONGO_DB=${MONGO_DB}
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672/
      - INFLUXDB_URL=http://influxdb:8086
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - FRONTEND_ADM_URL=${FRONTEND_ADM_URL}
      - FRONTEND_CTM_URL=${FRONTEND_CTM_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      - GOOGLE_OAUTH_AUTH_URL=${GOOGLE_OAUTH_AUTH_URL}
      - GOOGLE_OAUTH_TOKEN_URL=${GOOGLE_OAUTH_TOKEN_URL}
      - GOOGLE_OAUTH_USERINFO_URL=${GOOGLE_OAUTH_USERINFO_URL}
      - GOOGLE_OAUTH_TOKENINFO_URL=${GOOGLE_OAUTH_TOKENINFO_URL}
      - MQTT_URL=mqtt://mosquitto:${MQTT_PORT:-1883}
      - MQTT_TLS_PORT=${MQTT_TLS_PORT:-8883}
      - AES_SECRET_KEY=${AES_SECRET_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    command: sh -c "npm install --prefix /ai-services --no-save --no-package-lock && npm start"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      influxdb:
        condition: service_started
    restart: always

  # 4. MongoDB (Event DB - Lưu sự kiện, rule, incident)
  mongodb:
    image: mongo:6-jammy
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # 5. InfluxDB (Time-series DB - Lưu telemetry từ thiết bị)
  influxdb:
    image: influxdb:1.8-alpine
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - INFLUXDB_ADMIN_USER=${INFLUXDB_ADMIN_USER}
      - INFLUXDB_ADMIN_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - INFLUXDB_DB=${INFLUXDB_DB}
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb
    restart: always
    healthcheck:
      # Use influx CLI with credentials (required when auth is enabled)
      test: ["CMD-SHELL", "influx -execute 'SHOW DATABASES' -username $$INFLUXDB_ADMIN_USER -password $$INFLUXDB_ADMIN_PASSWORD 2>/dev/null || influx -execute 'SHOW DATABASES' 2>/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # 6. Mosquitto (MQTT Protocol cho IoT)
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "${MQTT_PORT}:${MQTT_PORT}"
      - "${MQTT_TLS_PORT}:${MQTT_TLS_PORT}"
    volumes:
      - ./backend/mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: always
    healthcheck:
      # Check mosquitto process is running via its pid file
      test: ["CMD-SHELL", "cat /mosquitto/data/mosquitto.pid 2>/dev/null | xargs -r kill -0 2>/dev/null || mosquitto -h >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 7. RabbitMQ (Message Queue)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # 8. Nginx (Reverse Proxy / SSL Termination)
  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - ./frontend-adm/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend-adm
      - frontend-ctm
      - backend
    restart: always

  # 9. IoT Simulator
  iot-simulator:
    build:
      context: ./iot-simulator
    volumes:
      - ./iot-simulator:/app
      - /app/node_modules
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - MQTT_URL=mqtt://mosquitto:${MQTT_PORT:-1883}
      - MQTT_TLS_PORT=${MQTT_TLS_PORT:-8883}
      - MQTT_CONTROL_TOPIC=${MQTT_CONTROL_TOPIC:-ics/control}
      - MQTT_TELEMETRY_TOPIC_PREFIX=${MQTT_TELEMETRY_TOPIC_PREFIX:-ics/telemetry}
      - AES_SECRET_KEY=${AES_SECRET_KEY}
      - SIMULATOR_INTERVAL_MS=${SIMULATOR_INTERVAL_MS:-5000}
      - SIMULATOR_DEVICE_COUNT=${SIMULATOR_DEVICE_COUNT:-50}
      - SIMULATOR_STARTUP_TIMEOUT_MS=${SIMULATOR_STARTUP_TIMEOUT_MS:-2000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: always



volumes:
  mongodb_data:
  influxdb_data:
  mosquitto_data:
  mosquitto_log:
  rabbitmq_data:
