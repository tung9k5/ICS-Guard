services:
  # 1. Frontend Admin (ReactJS)
  frontend-adm:
    build:
      context: ./frontend-adm
    ports:
      - "3000:3000"
    volumes:
      - ./frontend-adm:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      - backend
    restart: always

  # 2. Frontend Customer (ReactJS)
  frontend-ctm:
    build:
      context: ./frontend-ctm
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-ctm:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      - backend
    restart: always

  # 3. Backend API (Node.js / Express)
  backend:
    build:
      context: ./backend
      args:
        - AI_SERVICES_PATH=../ai-services
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./ai-services:/ai-services
      - /ai-services/node_modules
    env_file:
      - .env
    environment:
      - PORT=${BACKEND_PORT}
    command: sh -c "npm install --prefix /ai-services --no-save --no-package-lock && npm start"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      influxdb:
        condition: service_started
    restart: always

  # 4. MongoDB (Event DB - Lưu sự kiện, rule, incident)
  mongodb:
    image: mongo:6-jammy
    env_file:
      - .env
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # 5. InfluxDB (Time-series DB - Lưu telemetry từ thiết bị)
  influxdb:
    image: influxdb:1.8-alpine
    env_file:
      - .env
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb
    restart: always
    healthcheck:
      # Use influx CLI with credentials (required when auth is enabled)
      test: ["CMD-SHELL", "influx -execute 'SHOW DATABASES' -username $$INFLUXDB_ADMIN_USER -password $$INFLUXDB_ADMIN_PASSWORD 2>/dev/null || influx -execute 'SHOW DATABASES' 2>/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # 6. Mosquitto (MQTT Protocol cho IoT)
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "${MQTT_PORT}:${MQTT_PORT}"
      - "${MQTT_TLS_PORT}:${MQTT_TLS_PORT}"
    volumes:
      - ./backend/mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: always
    healthcheck:
      # Check mosquitto process is running via its pid file
      test: ["CMD-SHELL", "cat /mosquitto/data/mosquitto.pid 2>/dev/null | xargs -r kill -0 2>/dev/null || mosquitto -h >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 7. RabbitMQ (Message Queue)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    env_file:
      - .env
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # 8. Nginx (Reverse Proxy / SSL Termination)
  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - ./frontend-adm/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend-adm
      - frontend-ctm
      - backend
    restart: always

  # 9. IoT Simulator
  iot-simulator:
    build:
      context: ./iot-simulator
    ports:
      - "5001:5001"
    volumes:
      - ./iot-simulator:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: always



volumes:
  mongodb_data:
  influxdb_data:
  mosquitto_data:
  mosquitto_log:
  rabbitmq_data:
